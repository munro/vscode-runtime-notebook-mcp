name: Publish

# Publishes to the VS Code Marketplace with trusted publishing (OIDC): the Marketplace policy
# trusts this repo + this workflow file, so no token is stored anywhere. Run it by hand.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npx tsc --noEmit -p .
      - run: npm test
      - run: npm run package
      - run: npx vsce publish --oidc --packagePath better-notebook-mcp-server-*.vsix
